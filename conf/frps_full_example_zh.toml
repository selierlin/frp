# 此配置文件仅供参考，请勿直接用于生产环境运行，其中包含各类示例可能相互冲突。

# frps 监听地址。IPv6 地址须用方括号括起，如 "[::1]:80"、"[ipv6-host]:http"。
# 单独的 bindAddr 字段无需方括号，如 bindAddr = "::"。
bindAddr = "0.0.0.0"
bindPort = 7000

# KCP 协议监听的 UDP 端口，可与 bindPort 相同。
# 不设置则禁用 KCP 协议。
kcpBindPort = 7000

# QUIC 协议监听的 UDP 端口。
# 不设置则禁用 QUIC 协议。
# quicBindPort = 7002

# 代理监听地址，默认与 bindAddr 相同。
# proxyBindAddr = "127.0.0.1"

# QUIC 协议参数
# transport.quic.keepalivePeriod = 10
# transport.quic.maxIdleTimeout = 30
# transport.quic.maxIncomingStreams = 100000

# 心跳超时配置，一般不建议修改默认值。
# heartbeatTimeout 默认 90 秒，设置负值可禁用。
# transport.heartbeatTimeout = 90

# 每个代理维持的连接池最大数量
transport.maxPoolCount = 5

# 是否启用 TCP 流多路复用，默认 true
# transport.tcpMux = true

# TCP 多路复用的 keepalive 间隔（秒），仅在 tcpMux 为 true 时有效
# transport.tcpMuxKeepaliveInterval = 30

# frpc 与 frps 之间长连接的 TCP keepalive 探测间隔（秒）。
# 负数表示禁用 keepalive。
# transport.tcpKeepalive = 7200

# 是否强制只接受 TLS 加密连接，默认 false
transport.tls.force = false

# TLS 服务端证书与密钥（启用 TLS 时使用）
# transport.tls.certFile = "server.crt"
# transport.tls.keyFile = "server.key"
# transport.tls.trustedCaFile = "ca.crt"

# 虚拟主机（vhost）功能所需的 HTTP/HTTPS 监听端口（可选）。
# 注意：http 端口和 https 端口可以与 bindPort 相同。
vhostHTTPPort = 80
vhostHTTPSPort = 443

# vhost HTTP 服务器的响应头超时时间（秒），默认 60 秒
# vhostHTTPTimeout = 60

# tcpmuxHTTPConnectPort 指定服务端监听 TCP HTTP CONNECT 请求的端口。
# 值为 0 时不开启 TCP 多路复用；非 0 时在该端口监听 HTTP CONNECT 请求。
# 默认值为 0。
# tcpmuxHTTPConnectPort = 1337

# 若 tcpmuxPassthrough 为 true，frps 将不对流量做任何处理，直接透传。
# tcpmuxPassthrough = false

# 管理面板（Dashboard）配置，需设置 webServer.port 才会启用。
webServer.addr = "127.0.0.1"
webServer.port = 7500
webServer.user = "admin"
webServer.password = "admin"
# 管理面板 TLS 证书（可选）
# webServer.tls.certFile = "server.crt"
# webServer.tls.keyFile = "server.key"
# 管理面板静态资源目录（仅调试模式使用）
# webServer.assetsDir = "./static"

# 是否在管理面板中启用 golang pprof 性能分析接口。
# 需先设置 webServer.port。
webServer.pprofEnable = false

# 是否在管理面板的 /metrics 接口上导出 Prometheus 监控指标
enablePrometheus = true

# 日志输出目标：console 或日志文件路径，如 ./frps.log
log.to = "./frps.log"
# 日志级别：trace、debug、info、warn、error
log.level = "info"
# 日志保留天数
log.maxDays = 3
# 当 log.to 为 console 时，是否禁用颜色输出，默认 false
log.disablePrintColor = false

# 是否将详细错误信息（含调试信息）发送给 frpc，默认 true
detailedErrorsToClient = true

# 认证方式：
#   token  — 使用 token 进行认证（默认）
#   oidc   — 使用 OIDC（Open ID Connect）令牌进行认证
auth.method = "token"

# auth.additionalScopes 指定额外需要携带认证信息的场景。
# 可选值：HeartBeats、NewWorkConns。
# auth.additionalScopes = ["HeartBeats", "NewWorkConns"]

# Token 认证密钥，需与 frpc 端保持一致
auth.token = "12345678"

# 也可以从文件加载 token，与 auth.token 互斥
# auth.tokenSource.type = "file"
# auth.tokenSource.file.path = "/etc/frp/token"

# OIDC 认证配置（使用 OIDC 方式时填写）
# issuer：用于验证 OIDC token 的签发方地址
auth.oidc.issuer = ""
# audience：OIDC token 中应包含的受众（audience）字段值
auth.oidc.audience = ""
# 是否跳过 OIDC token 的过期时间检查
auth.oidc.skipExpiryCheck = false
# 是否跳过 OIDC token 的 issuer 字段校验
auth.oidc.skipIssuerCheck = false

# 等待工作连接的最大超时时间（秒）
# userConnTimeout = 10

# 限制 frpc 可绑定的端口范围，默认不限制。
# 支持范围（start/end）和单个端口（single）两种写法。
allowPorts = [
  { start = 2000, end = 3000 },
  { single = 3001 },
  { single = 3003 },
  { start = 4000, end = 50000 }
]

# 每个客户端最多可使用的端口数，默认 0 表示不限制
maxPortsPerClient = 0

# 若 subDomainHost 非空，frpc 配置中 http/https 类型代理可设置 subdomain。
# 例如 subdomain = "test" 时，路由使用的 host 为 test.frps.com。
subDomainHost = "frps.com"

# HTTP 请求的自定义 404 页面路径
# custom404Page = "/path/to/404.html"

# UDP 数据包大小，单位为字节，默认 1500。
# 客户端与服务端须保持一致，影响 udp 和 sudp 代理。
udpPacketSize = 1500

# NAT 打洞策略数据的保留时间（小时）
natholeAnalysisDataReserveHours = 168

# SSH 隧道网关配置。
# 若要启用此功能，bindPort 为必填项，其余为可选项。
# 默认禁用，bindPort 大于 0 时自动启用。
# sshTunnelGateway.bindPort = 2200
# sshTunnelGateway.privateKeyFile = "/home/frp-user/.ssh/id_rsa"
# sshTunnelGateway.autoGenPrivateKeyPath = ""
# sshTunnelGateway.authorizedKeysFile = "/home/frp-user/.ssh/authorized_keys"

# ============================================================
# HTTP 插件配置示例
# frps 在特定事件（如登录、新建代理）时会回调这些插件的 HTTP 接口，
# 插件可实现自定义认证、鉴权、审计等逻辑。
# ============================================================

[[httpPlugins]]
name = "user-manager"
addr = "127.0.0.1:9000"
path = "/handler"
# ops 指定该插件处理的事件类型
ops = ["Login"]

[[httpPlugins]]
name = "port-manager"
addr = "127.0.0.1:9001"
path = "/handler"
ops = ["NewProxy"]

# 访问日志配置。
# 将每条第三方连接到代理的记录写入本地 SQLite 数据库。
# 可通过管理面板 API 查询：GET /api/accesslog
# 将 storagePath 留空（或省略此段）可禁用访问日志功能。
# [accessLog]
# storagePath = "./frps_access.db"
# reserveDays 指定保留多少天的记录，0 表示永久保留。
# reserveDays = 30
# queueSize 为内部异步写入队列的大小，默认 10000。
# queueSize = 10000
